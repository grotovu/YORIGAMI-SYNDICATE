; ==============================================================================
;                  ⛩️ SHION YORIGAMI COMPANION CONFIGURATION
; ==============================================================================
; Keyboard Virtual Key Reference:
; 89 = Y | 66 = B | 90 = Z | 71 = G | 84 = T | 67 = C | 88 = X | 72 = H | 75 = K
; ------------------------------------------------------------------------------

[Controls]
; Main modifier key held down for commands (Default: 89 = Y)
ModifierKey = 89

; Key to toggle Shion's stance: Peaceful (Unarmed) <-> Hostile (Sniper) (Default: 66 = B)
; Press ModifierKey + StanceKey (Y + B)
StanceKey = 66

; Key to order Shion to scavenge nearby bins/vending/carts (Default: 90 = Z)
; Press ModifierKey + ScavengeKey (Y + Z)
ScavengeKey = 90

; Key to cancel ongoing scavenging and recall Shion immediately (Default: 71 = G)
CancelScavengeKey = 71

; Key to prompt Shion for dialogue / thoughts (Default: 84 = T)
; Press ModifierKey + TalkKey (Y + T)
TalkKey = 84

; Key to toggle Shion: Material Ped <-> Hitodama Spirit Form (Default: 72 = H)
; Press ModifierKey + HitodamaKey (Y + H)
HitodamaKey = 72

; Key to swap weapons with Shion (Default: 82 = R)
; Press ModifierKey + SwapKey (Y + R)
SwapKey = 82

; Key to Perfect Possession switch between Jo'on and Shion (Default: 76 = L)
; Press ModifierKey + SwitchKey (Y + L)
SwitchKey = 76


[ChatPacing]
; Minimum seconds between ambient unprompted thoughts (Default: 90s)
MinChatDelaySeconds = 90
; Maximum seconds between ambient unprompted thoughts (Default: 150s)
MaxChatDelaySeconds = 150

; ==============================================================================
;                  👑 SHION COMPANION & WALLET DRAIN SETTINGS
; ==============================================================================
[Companion]
; COMBAT RESOURCE MODE: 0 = Wallet Drain (Infinite ammo, costs cash per shot)
;                       1 = Gear Swap (Player gives weapon & ammo via TAB + Y)
CombatResourceMode =1

; (0/1) Enable Shion draining player's wallet per bullet fired. Disable and set CombatResourceMode to 0 so it doesn't drain your wallet but Shion still has infinite ammo.
EnableWalletDrain = 0

; (0/1) Play quiet cash register chime on every shot Shion fires
PlayShotCashSound =0

; (0/1) Show bankruptcy / card declined alert when out of ammo funds
ShowBankruptAlert =1

; (0/1) Enable blue Hitodama spirit flames orbiting physical Shion during combat
EnableCombatHitodamaFX =1

; STARTUP PLAYER CHARACTER: 0 = CJ, 1 = Jo'on, 2 = Shion (Default: 1)
StartupPlayerCharacter =1

; (0/1) Mute player character's speech lines and pain audio when playing as Jo'on or Shion
MuteCharacterVoice = 1

; JO'ON SMOKING IDLE SETTINGS
; (0/1) Enable Jo'on's exclusive 10-second idle smoking animation
EnableJoonSmoking =1

; Cooldown in seconds before Jo'on can smoke again after finishing
JoonSmokeCooldownSeconds = 45

; Cash cost deducted each time Jo'on smokes (Default: 1, 0 = Free)
CigaretteCost = 1

; Cooldown in seconds before Jo'on can complain about withdrawal again (Default: 90s)
WithdrawalCooldownSeconds = 90

; How many times Jo'on complains about withdrawal per game session, resets when loading the save. (Default: 3, -1 = infinitely)
MaxWithdrawalComplaints = 3

; (0/1) Suppress girlfriend phone calls and hide girlfriend map hearts while playing as Jo'on or Shion (Default: 1)
SuppressGirlfriends = 1

; (0/1) Hide model during shooting range when aiming. Only works for Jo'on or Shion.
HideModelInShootingRange = 1

; ==============================================================================
;                  🍔 SHION HUNGER & FOOD RUN SETTINGS (debug: type HUNGRY, FOOD, INJURED)
; ==============================================================================
[FoodRun]
; (0/1) Enable Shion getting hungry and asking for food stops
EnableFoodRuns =1

; In-game hours before Shion gets hungry (48 hours = 2 game days)
HungerIntervalHours = 48


; ==============================================================================
;                  👑 SHION PIMPING MANAGEMENT SETTINGS
; ==============================================================================
[Pimping]
; (0/1) Show help box when near working girls in a 4-door car (once per session)
ShowPimpPrompt = 1


; ==============================================================================
;                  📖 SHION LORE & PROGRESSION SYSTEM
; ==============================================================================
[LoreSettings]
; (0/1) Enable episodic story conversations
EnableLore =1
; Seconds player has to press [Y] or [N] before Shion drops the topic
PromptTimeoutSeconds = 8
; Seconds Shion waits before asking again if you say [N] or ignore her (180s = 3 mins)
DeclineCooldownSeconds = 180
